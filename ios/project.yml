name: Momentum
options:
  developmentLanguage: en
  knownRegions: [en, de]
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: true
    LOCALIZATION_PREFERS_STRING_CATALOGS: true
    MARKETING_VERSION: "0.4.7"
    CURRENT_PROJECT_VERSION: "407"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: false
    TARGETED_DEVICE_FAMILY: "1,2"
packages:
  MomentumCore:
    path: ../macos/Packages/MomentumCore
  MomentumKit:
    path: ../macos/Packages/MomentumKit
  MomentumMobile:
    path: Packages/MomentumMobile
targets:
  Momentum:
    type: application
    platform: iOS
    sources:
      - Momentum
      - ../macos/Momentum/Services/TaskEntities.swift
      - ../macos/Momentum/Services/TaskIntents.swift
      - ../macos/Momentum/Services/CreateTaskIntent.swift
      - ../macos/Momentum/Resources/AppShortcuts.xcstrings
    preBuildScripts:
      - name: Verify Rust core build
        script: |
          if [ "$CONFIGURATION" = "Debug" ]; then
            "$SRCROOT/scripts/build-core.sh" --debug
          else
            "$SRCROOT/scripts/build-core.sh"
          fi
        basedOnDependencyAnalysis: false
    dependencies:
      - package: MomentumCore
      - package: MomentumKit
      - package: MomentumMobile
      - target: MomentumShare
    # XcodeGen regenerates the entitlements file from these properties on every generate.
    entitlements:
      path: Momentum/Momentum.entitlements
      properties:
        com.apple.security.application-groups: [group.com.codedbydan.Momentum]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codedbydan.Momentum.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: MomentumIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        OTHER_LDFLAGS: "$(inherited) -lresolv"
    info:
      path: Momentum/Info.plist
      properties:
        NSRemindersFullAccessUsageDescription: "Momentum imports reminders from the list you choose. Your Apple Reminders are never changed."
        CFBundleDisplayName: Momentum
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: com.codedbydan.Momentum.tasks
            CFBundleURLSchemes: [momentum, superproductivity]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.codedbydan.momentum.tasks
            UTTypeDescription: Momentum Tasks
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        BGTaskSchedulerPermittedIdentifiers:
          - com.codedbydan.Momentum.ios.notifications.refresh
          - com.codedbydan.Momentum.ios.sync.refresh
        UIBackgroundModes:
          - fetch
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSHumanReadableCopyright: "© 2026 Dan Hart. GPL-3.0-or-later."
  # Share sheet entry: writes one file per shared item into the App Group inbox; the app
  # imports it on its next foreground. The extension never opens the task store.
  MomentumShare:
    type: app-extension
    platform: iOS
    sources:
      - path: MomentumShare
      - path: Momentum/Resources/Localizable.xcstrings
    dependencies:
      - package: MomentumCore
      - package: MomentumKit
    # XcodeGen regenerates the entitlements file from these properties on every generate.
    entitlements:
      path: MomentumShare/MomentumShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.codedbydan.Momentum]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codedbydan.Momentum.ios.Share
        OTHER_LDFLAGS: "$(inherited) -lresolv"
        SKIP_INSTALL: true
    info:
      path: MomentumShare/Info.plist
      properties:
        CFBundleDisplayName: Momentum
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
  MomentumTestHost:
    type: application
    platform: iOS
    sources:
      - path: MomentumTestHost
      # SwiftUI resolves default strings from the host's main bundle during rendering.
      - path: Momentum/Resources/Localizable.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codedbydan.Momentum.TestHost
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: "Synthetic reminder fixtures in an isolated simulator only."
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
  MomentumViewTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MomentumViewTests
      # Compile the real views, not copies. Exclude all production entry points:
      # the test host never opens stores, starts clocks or requests permissions.
      - path: Momentum
        excludes: [App/MomentumApp.swift, App/MobileAppDelegate.swift, Info.plist, Resources/MomentumIcon.icon]
    dependencies:
      - target: MomentumTestHost
      - package: MomentumCore
      - package: MomentumKit
      - package: MomentumMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codedbydan.Momentum.ViewTests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MomentumTestHost.app/MomentumTestHost"
        BUNDLE_LOADER: "$(TEST_HOST)"
        OTHER_LDFLAGS: "$(inherited) -lresolv"
  MomentumTransportTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MomentumTransportTests]
    dependencies:
      - target: MomentumTestHost
      - package: MomentumCore
      - package: MomentumKit
      - package: MomentumMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codedbydan.Momentum.TransportTests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MomentumTestHost.app/MomentumTestHost"
        BUNDLE_LOADER: "$(TEST_HOST)"
        OTHER_LDFLAGS: "$(inherited) -lresolv"
schemes:
  MomentumTransportTests:
    build:
      targets:
        MomentumTestHost: all
        MomentumTransportTests: [test]
    test:
      targets:
        - name: MomentumTransportTests
          parallelizable: false
      gatherCoverageData: false
  MomentumPerformanceTests:
    build:
      targets:
        MomentumTestHost: all
        MomentumViewTests: [test]
    test:
      config: Release
      targets:
        - name: MomentumViewTests
          parallelizable: false
          selectedTests: [SnapshotPerformanceTests]
      environmentVariables:
        MOMENTUM_PERFORMANCE_TESTS: "1"
      gatherCoverageData: false
  MomentumSpotlightTests:
    build:
      targets:
        MomentumTestHost: all
        MomentumViewTests: [test]
    test:
      targets:
        - name: MomentumViewTests
          parallelizable: false
          selectedTests: [SpotlightSystemTests]
      environmentVariables:
        MOMENTUM_SPOTLIGHT_NATIVE: "1"
      gatherCoverageData: false
  MomentumFastTests:
    build:
      targets:
        MomentumTestHost: all
        MomentumViewTests: [test]
    test:
      targets:
        - name: MomentumViewTests
          parallelizable: false
      gatherCoverageData: false
  Momentum:
    build:
      targets:
        Momentum: all
        MomentumShare: all
      preActions:
        - name: Prepare Apple core
          settingsTarget: Momentum
          script: |
            if [ "$CONFIGURATION" = "Debug" ]; then
              "$SRCROOT/scripts/build-core.sh" --debug
            else
              "$SRCROOT/scripts/build-core.sh"
            fi
