on:
  push:
    branches: [main]
  pull_request:

name: CI

jobs:
  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Run cargo fmt
        run: cargo fmt --all -- --check

  translations:
    name: Translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gettext
        run: sudo apt-get update -q && sudo apt-get install -y -q gettext
      - name: POTFILES.in lists every file with strings
        run: build-aux/check-potfiles.sh
      - name: Every .po compiles
        run: |
          for f in po/*.po; do msgfmt --check --statistics -o /dev/null "$f"; done
      - name: LINGUAS matches the .po files
        run: |
          diff <(grep -v '^#' po/LINGUAS | sort) <(ls po/*.po | xargs -n1 basename | sed 's/\.po$//' | sort)

  flatpak:
    name: Flatpak (${{ matrix.arch }})
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
    - uses: actions/checkout@v4
    - uses: flathub-infra/flatpak-github-actions/flatpak-builder@933e9e8ca36e85046ebca8e211f0785c6becac40
      with:
        bundle: momentum-${{ matrix.arch }}.flatpak
        manifest-path: build-aux/io.github.dan_hart.Momentum.Devel.json
        run-tests: true
        arch: ${{ matrix.arch }}
        cache-key: flatpak-builder-${{ matrix.arch }}-${{ github.sha }}
