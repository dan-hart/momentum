on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs this same suite against the tag before it builds anything.
  workflow_call:
    inputs:
      ref:
        description: "Git ref to test (default: the commit that triggered the caller)"
        type: string
        required: false
        default: ""

name: CI

jobs:
  versions:
    name: Versions aligned
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      # Cargo.toml, meson.build, macos/project.yml, the metainfo and CHANGELOG.md all
      # carry the version; build-aux/release.py bump keeps them equal and this proves it.
      - run: build-aux/release.py check

  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Check out LibreSync (path dependency of crates/sp-p2p)
        uses: actions/checkout@v4
        with:
          repository: dan-hart/LibreSync
          ref: v0.6.0
          path: libresync-src
          token: ${{ secrets.LIBRESYNC_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Run cargo fmt
        # Not --all: that would also format the LibreSync checkout in libresync-src.
        run: cargo fmt -p momentum -p mo -p momentum-core -p momentum-ffi -p uniffi-bindgen -p sp-model -p sp-oplog -p sp-store -p sp-sync -p sp-p2p -- --check

  core-tests:
    name: Core tests (no GTK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Check out LibreSync (path dependency of crates/sp-p2p)
        uses: actions/checkout@v4
        with:
          repository: dan-hart/LibreSync
          ref: v0.6.0
          path: libresync-src
          token: ${{ secrets.LIBRESYNC_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Native libraries for the mo keyring
        run: sudo apt-get update -q && sudo apt-get install -y -q libdbus-1-dev pkg-config
      - name: Test every crate except the GTK app
        run: cargo test --workspace --exclude momentum
        env:
          DBUS_SESSION_BUS_ADDRESS: unix:path=/nonexistent

  translations:
    name: Translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Install gettext
        run: sudo apt-get update -q && sudo apt-get install -y -q gettext
      - name: POTFILES.in lists every file with strings
        run: build-aux/check-potfiles.sh
      - name: Every .po compiles
        run: |
          for f in po/*.po; do msgfmt --check --statistics -o /dev/null "$f"; done
      - name: LINGUAS matches the .po files
        run: |
          diff <(grep -v '^#' po/LINGUAS | sort) <(ls po/*.po | xargs -n1 basename | sed 's/\.po$//' | sort)

  flatpak:
    name: Flatpak (${{ matrix.arch }})
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref || github.sha }}
    - name: Check out LibreSync (path dependency of crates/sp-p2p)
      uses: actions/checkout@v4
      with:
        repository: dan-hart/LibreSync
        ref: v0.6.0
        path: libresync-src
        token: ${{ secrets.LIBRESYNC_TOKEN || github.token }}
    - uses: flathub-infra/flatpak-github-actions/flatpak-builder@933e9e8ca36e85046ebca8e211f0785c6becac40
      with:
        bundle: momentum-${{ matrix.arch }}.flatpak
        manifest-path: build-aux/io.github.dan_hart.Momentum.Devel.json
        run-tests: true
        arch: ${{ matrix.arch }}
        cache-key: flatpak-builder-${{ matrix.arch }}-${{ github.sha }}
