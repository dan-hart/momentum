# One release for every platform. Pushing a vX.Y.Z tag (or dispatching with an existing
# tag) runs the full CI and macOS suites against that tag, then builds every binary,
# publishes the GitHub Release with all of them attached, updates the Homebrew tap,
# publishes and verifies the signed self-hosted Flatpak repository. Flathub submission
# is deliberately excluded.
#
# Cut a release with:  build-aux/release.py bump X.Y.Z && git commit -a && git tag ...
# Details, required secrets and what happens when one is missing: docs/RELEASING.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.4.0)"
        required: true

permissions:
  contents: write
  pages: write

concurrency:
  group: momentum-release
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  APP_ID: io.github.dan_hart.Momentum
  # Keep in step with the LibreSync checkouts in ci.yml and macos.yml.
  LIBRESYNC_REF: v0.6.0

jobs:
  # ---------------------------------------------------------------- 1. the tag is sound
  verify:
    name: Verify tag and versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sign_macos: ${{ steps.gates.outputs.sign_macos }}
      notarize_macos: ${{ steps.gates.outputs.notarize_macos }}
    steps:
      - name: Check out release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Required publishing configuration
        env:
          HOMEBREW_TAP_SSH_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          FLATPAK_GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
          FLATPAK_GPG_FINGERPRINT: ${{ vars.FLATPAK_GPG_FINGERPRINT }}
        run: python3 build-aux/release-channels.py credentials
      - name: Required macOS distribution signing and notarization
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: python3 macos/scripts/release-signing.py credentials
      - name: Required authenticated macOS updater configuration
        env:
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: python3 build-aux/sparkle-release.py credentials --shape-only
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Require a tag that supports authenticated desktop updates
        run: |
          test -f build-aux/sparkle-release.py || { echo "Legacy tags must use their original release workflow; refusing to rebuild them with updater tooling." >&2; exit 1; }
      - name: Every copy of the version equals the tag
        run: build-aux/release.py check --tag "$TAG"
      - id: version
        run: echo "version=$(build-aux/release.py version)" >> "$GITHUB_OUTPUT"
      - name: Release notes from CHANGELOG.md
        run: |
          VERSION=$(build-aux/release.py version)
          {
            build-aux/release.py notes "$VERSION"
            cat <<EOF

          ## Install

          | Platform | |
          |---|---|
          | macOS app | \`brew install --cask dan-hart/tap/momentum\`, or open \`Momentum-v$VERSION-macos.zip\` below |
          | Linux app | \`flatpak install --user https://dan-hart.github.io/momentum/momentum.flatpakref\`, or the \`.flatpak\` bundle below |
          | Android | APK/AAB, matching source and distribution notes below. A file labelled \`-unsigned\` requires signing before installation; no store upload is performed. |
          | \`mo\` command line | \`brew install dan-hart/tap/momentum-cli\` on macOS or Linux, or a \`mo-*\` archive below |

          Every file is listed with its digest in \`SHA256SUMS.txt\`.
          EOF
          } > release-notes.md
          cat release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
      - id: gates
        run: |
          echo "sign_macos=true" >> "$GITHUB_OUTPUT"
          echo "notarize_macos=true" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------- 2. every test passes
  tests:
    name: CI
    needs: verify
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
    secrets: inherit

  macos-tests:
    name: macOS
    needs: verify
    uses: ./.github/workflows/macos.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
    secrets: inherit

  android:
    name: Android APK, bundle and source
    needs: [verify, tests, macos-tests]
    uses: ./.github/workflows/android.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
      release_artifacts: true
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  # ---------------------------------------------------------------- 3. build the binaries
  flatpak:
    name: Flatpak bundle (${{ matrix.arch }})
    needs: [verify, tests, macos-tests]
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Check out LibreSync (path dependency of crates/momentum-p2p)
        uses: actions/checkout@v4
        with:
          repository: dan-hart/LibreSync
          ref: ${{ env.LIBRESYNC_REF }}
          path: libresync-src
          token: ${{ secrets.LIBRESYNC_TOKEN || github.token }}
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@933e9e8ca36e85046ebca8e211f0785c6becac40
        with:
          bundle: momentum-${{ env.TAG }}-${{ matrix.arch }}.flatpak
          manifest-path: build-aux/io.github.dan_hart.Momentum.json
          run-tests: true
          arch: ${{ matrix.arch }}
          cache-key: flatpak-release-${{ matrix.arch }}-${{ github.sha }}
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-${{ matrix.arch }}
          path: momentum-${{ env.TAG }}-${{ matrix.arch }}.flatpak
          if-no-files-found: error

  macos:
    name: macOS app and mo
    needs: [verify, tests, macos-tests]
    # MomentumKit links macOS 26 APIs; the app targets macOS 26.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Check out LibreSync (path dependency of crates/momentum-p2p)
        uses: actions/checkout@v4
        with:
          repository: dan-hart/LibreSync
          ref: ${{ env.LIBRESYNC_REF }}
          path: libresync-src
          token: ${{ secrets.LIBRESYNC_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen
      - name: Import the Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
        run: python3 macos/scripts/release-keychain.py create
      - name: Native signing and dyld launch regressions
        env:
          MOMENTUM_REQUIRE_SIGNING_FIXTURE: "1"
        run: |
          python3 macos/scripts/build-env.py env \
            "MOMENTUM_SIGNING_FIXTURE_IDENTITY=$MACOS_SIGN_IDENTITY" MOMENTUM_REQUIRE_SIGNING_FIXTURE=1 \
            python3 -m unittest discover -s macos/scripts/tests -p test_release_signing.py -v
      - name: Download pinned Sparkle signing tools
        run: |
          mkdir -p "$RUNNER_TEMP/sparkle"
          curl --fail --location --retry 3 https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz -o "$RUNNER_TEMP/sparkle.tar.xz"
          echo "c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c  $RUNNER_TEMP/sparkle.tar.xz" | shasum -a 256 --check
          tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workflow-test parser
        run: python3 -m pip install PyYAML==6.0.2
      - name: Sparkle signature interoperability regressions
        env:
          SPARKLE_SIGN_TOOL: ${{ runner.temp }}/sparkle/bin/sign_update
        run: python3 -m unittest discover -s build-aux/tests -p test_sparkle_release.py -v
      - name: Verify updater signing key pair before packaging
        env:
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: python3 build-aux/sparkle-release.py credentials
      - name: Build, sign, notarize and package
        env:
          REQUIRE_UNIVERSAL: "1"
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: macos/scripts/package-app.sh dist
      - name: Sign exact final archive and generate appcast
        env:
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          VERSION=$(build-aux/release.py version)
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' build/macos-release/Build/Products/Release/Momentum.app/Contents/Info.plist)
          python3 build-aux/sparkle-release.py sign --archive "dist/Momentum-v$VERSION-macos.zip" \
            --feed dist/appcast.xml --version "$VERSION" --build "$BUILD" --tool "$RUNNER_TEMP/sparkle/bin/sign_update"
          printf '%s\n' "$SPARKLE_PUBLIC_KEY" > dist/sparkle-public-key.txt
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*
          if-no-files-found: error
      - name: Remove temporary signing material
        if: always()
        run: python3 macos/scripts/release-keychain.py cleanup

  cli-linux:
    name: mo for Linux (${{ matrix.arch }})
    needs: [verify, tests, macos-tests]
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Ubuntu 22.04's glibc 2.35 is what Homebrew on Linux and most desktop distributions
    # of the last few years can load; a binary built on a newer image would not be.
    container: ubuntu:22.04
    steps:
      - name: Build dependencies
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q \
            build-essential curl ca-certificates git pkg-config libdbus-1-dev
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Check out LibreSync (path dependency of crates/momentum-p2p)
        uses: actions/checkout@v4
        with:
          repository: dan-hart/LibreSync
          ref: ${{ env.LIBRESYNC_REF }}
          path: libresync-src
          token: ${{ secrets.LIBRESYNC_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build and package mo
        run: |
          cargo build -p mo --release --locked
          VERSION=${{ needs.verify.outputs.version }}
          SAYS=$(target/release/mo --version | awk '{print $2}')
          [ "$SAYS" = "$VERSION" ] || { echo "mo says $SAYS, tag says $VERSION" >&2; exit 1; }
          mkdir -p dist
          tar -czf "dist/mo-v$VERSION-linux-${{ matrix.arch }}.tar.gz" -C target/release mo
      - uses: actions/upload-artifact@v4
        with:
          name: cli-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # ------------------------------------------------- 4. the signed Flatpak repository
  flatpak-repo:
    name: Publish Flatpak repository (${{ matrix.arch }})
    needs: [verify, tests, macos-tests]
    env:
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
      ARCH: ${{ matrix.arch }}
      KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
      EXPECTED_FINGERPRINT: ${{ vars.FLATPAK_GPG_FINGERPRINT }}
    # Architectures run one after the other so both export into the same OSTree repo.
    strategy:
      max-parallel: 1
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - name: Check out the tag to build
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          path: src
      - name: Check out LibreSync (path dependency of crates/momentum-p2p)
        uses: actions/checkout@v4
        with:
          repository: dan-hart/LibreSync
          ref: ${{ env.LIBRESYNC_REF }}
          path: src/libresync-src
          token: ${{ secrets.LIBRESYNC_TOKEN || github.token }}
      - name: Check out release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: release-tools
          persist-credentials: false
      - name: Check out the repository branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: repo
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Import signing key
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: printf '%s' "$FLATPAK_GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Preserve the trusted signing identity
        run: python3 release-tools/build-aux/release-channels.py check-signing-key --key-id "$KEY_ID" --fingerprint "$EXPECTED_FINGERPRINT"
      - name: Build and export
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          [ -f repo/config ] || ostree init --repo=repo --mode=archive
          # git does not keep empty directories; OSTree expects these to exist.
          mkdir -p repo/refs/heads repo/refs/remotes repo/refs/mirrors repo/objects repo/tmp repo/state
          python3 release-tools/build-aux/release-channels.py check-flatpak --repo repo --version "$RELEASE_VERSION"
          flatpak-builder --user --disable-rofiles-fuse --force-clean --install-deps-from=flathub \
            --arch=${{ matrix.arch }} --default-branch=stable \
            --repo=repo --gpg-sign="$KEY_ID" build-dir "src/build-aux/$APP_ID.json"
          python3 release-tools/build-aux/release-channels.py check-flatpak --repo repo --version "$RELEASE_VERSION" --arch "$ARCH"
          flatpak build-update-repo --generate-static-deltas --prune --prune-depth=3 \
            --gpg-sign="$KEY_ID" repo
          # Site files must survive the OSTree metadata regeneration.
          rm -rf repo/tmp
      - name: Publish
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 ../release-tools/build-aux/release-channels.py publish-git --repo . --branch gh-pages --message "Publish $TAG ($ARCH)"

  # ----------------------------------------------------------- 5. the GitHub Release
  release:
    name: GitHub Release
    needs: [verify, flatpak, flatpak-repo, macos, cli-linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      # Only this workflow's own build artifacts: the CI suite it calls also uploads the
      # Devel bundles it tested, which must not end up on the release.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "{flatpak-*,macos,cli-linux-*,android-release}"
          merge-multiple: true
      - name: Digests
        run: |
          build-aux/release.py checksums --assets dist
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - name: Preserve any already-published release bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > existing-release.json 2> existing-release-error.txt; then
            mkdir -p existing-assets
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir existing-assets
            python3 build-aux/sparkle-release.py immutable-assets --incoming dist --existing existing-assets
          else
            # A network/auth/rate-limit failure is not proof that the release is new.
            grep -q '(HTTP 404)' existing-release-error.txt || exit 1
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Momentum ${{ needs.verify.outputs.version }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/*.flatpak
            dist/*.zip
            dist/*.tar.gz
            dist/*.apk
            dist/*.aab
            dist/*-android-*.txt
            dist/*-android-*.json
            dist/SHA256SUMS.txt
            dist/appcast.xml
            dist/sparkle-public-key.txt

  # ---------------------------------------------- 6. required install channels
  install-channels:
    name: Publish and verify install channels
    needs: [verify, release, flatpak-repo, sparkle-feed]
    uses: ./.github/workflows/install-channels.yml
    with:
      version: ${{ needs.verify.outputs.version }}
      tooling_ref: ${{ github.sha }}
      notarized: ${{ needs.verify.outputs.notarize_macos == 'true' }}
      gpg_fingerprint: ${{ vars.FLATPAK_GPG_FINGERPRINT }}
    secrets:
      HOMEBREW_TAP_SSH_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}

  # Publish only after public release assets exist. Flatpak exports have completed,
  # so this scoped commit preserves their repository without concurrent writes.
  sparkle-feed:
    name: Publish authenticated macOS update feed
    needs: [verify, release, flatpak-repo]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: hosted-repo
      - name: Download final public archive and feed
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --dir public-assets \
            --pattern "Momentum-v$VERSION-macos.zip" --pattern appcast.xml --pattern sparkle-public-key.txt
      - name: Validate signature, exact public bytes and trust continuity
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: |
          python3 build-aux/sparkle-release.py validate --archive "public-assets/Momentum-v$VERSION-macos.zip" \
            --feed public-assets/appcast.xml --previous hosted-repo/appcast.xml
          python3 build-aux/sparkle-release.py check-public-key --key-file public-assets/sparkle-public-key.txt \
            --previous-key-file hosted-repo/sparkle-public-key.txt
      - name: Publish scoped feed files
        run: |
          cp public-assets/appcast.xml public-assets/sparkle-public-key.txt hosted-repo/
          git -C hosted-repo config user.name "github-actions[bot]"
          git -C hosted-repo config user.email "github-actions[bot]@users.noreply.github.com"
          python3 build-aux/release-channels.py publish-git --repo hosted-repo --branch gh-pages \
            --message "Publish authenticated macOS update feed" --path appcast.xml --path sparkle-public-key.txt
      - name: Deploy and verify public update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq .status
          python3 build-aux/sparkle-release.py verify-hosted --feed public-assets/appcast.xml
