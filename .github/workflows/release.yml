# Builds Flatpak bundles for a tagged release and attaches them to the GitHub Release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  bundle:
    name: Flatpak bundle (${{ matrix.arch }})
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@933e9e8ca36e85046ebca8e211f0785c6becac40
        with:
          bundle: momentum-${{ github.ref_name }}-${{ matrix.arch }}.flatpak
          manifest-path: build-aux/io.github.dan_hart.Momentum.json
          run-tests: true
          arch: ${{ matrix.arch }}
          cache-key: flatpak-release-${{ matrix.arch }}-${{ github.sha }}
      - uses: softprops/action-gh-release@v2
        with:
          files: momentum-${{ github.ref_name }}-${{ matrix.arch }}.flatpak
          generate_release_notes: true
