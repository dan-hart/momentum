# Builds the shared Rust core for Apple targets, checks the Swift bindings still match it,
# and runs the macOS unit tests. These need no app to launch and no UI automation, so the
# whole job is a couple of minutes.
name: macOS

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-and-app:
    name: Core, bindings and app
    # MomentumKit's tests link macOS 26 APIs and must run on that OS, not just build its SDK.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Check out LibreSync (path dependency of crates/sp-p2p)
        uses: actions/checkout@v4
        with:
          repository: dan-hart/LibreSync
          ref: v0.6.0
          path: libresync-src
          token: ${{ secrets.LIBRESYNC_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # The core's own tests run on every platform; this is the macOS half of "it still
      # works on both", and it must pass before anything Swift is built on top of it.
      - name: Core tests
        run: cargo test --workspace --exclude momentum

      - name: Build the core and generate the Swift bindings
        run: macos/scripts/build-core.sh

      # The bindings are generated from the compiled library, so a core API change that
      # the Swift side has not caught up with fails here.
      #
      # --build-system swiftbuild: only that build system runs the string catalog through
      # xcstringstool, the way Xcode builds the app. The legacy "native" one copies
      # Localizable.xcstrings into the bundle verbatim, so no de.lproj exists and
      # LocalizationTests fails on a packaging difference rather than a real defect.
      - name: macOS unit tests
        run: swift test --package-path macos/Packages/MomentumKit --build-system swiftbuild

      # NearbySyncTests is deliberately not run here. It pairs two nodes over loopback and
      # then relies on P2p::sync_all, which discovers peers before falling back to a stored
      # address, and it has never passed on a hosted runner: the exchange after pairing
      # never lands, while sp-p2p's own two-device test (Core tests, above) passes on this
      # same runner in under a second. docs/TESTING.md keeps the local invocation:
      #
      #   MOMENTUM_TEST_NEARBY=1 swift test --package-path macos/Packages/MomentumKit \
      #     --build-system swiftbuild --filter NearbySyncTests
      #
      # Run it on real machines before a release; this job covers everything that does not
      # need the network.

      - name: Localization tooling and accessibility audit self-test
        run: |
          python3 -m unittest discover -s macos/scripts/tests -p test_localize.py
          swift macos/scripts/a11y-audit.swift --self-test

      - name: Build the app
        run: |
          brew install xcodegen
          cd macos
          xcodegen generate
          xcodebuild -project Momentum.xcodeproj -scheme Momentum -configuration Debug \
            -derivedDataPath ../build/macos CODE_SIGNING_ALLOWED=NO build

      - name: Verify extracted translations and compiled resources
        run: |
          python3 macos/scripts/localize.py --sync build/macos --require-complete
          swift macos/scripts/check-localization.swift build/macos/Build/Products/Debug/Momentum.app
