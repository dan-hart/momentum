name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Momentum version
      description: Shown in About (Ctrl+? → About Momentum) or in the Flatpak info
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How is it installed?
      options: [Flathub, Flatpak bundle from a release, Built from source]
    validations:
      required: true
  - type: input
    id: desktop
    attributes:
      label: Desktop and distribution
      placeholder: GNOME 50 on Fedora Silverblue 44
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: "Run `flatpak run --env=RUST_LOG=momentum=debug io.github.dan_hart.Momentum` and paste anything relevant. Remove server names or personal data."
      render: text
  - type: checkboxes
    id: sync
    attributes:
      label: Sync
      options:
        - label: This involves Nextcloud sync with Super Productivity
