[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
authors = ["Dan Hart <race-unbent-water@duck.com>"]
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/dan-hart/momentum"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = true
