[defaults.bindings.kotlin]
package_name = "com.codedbydan.momentum.core"
cdylib_name = "momentum_ffi"
android = true
android_cleaner = true
generate_immutable_records = true
kotlin_target_version = "2.4.21"

# Error payload fields otherwise collide with Kotlin Throwable.message and
# UniFFI's generated message override. Only the Kotlin projection is renamed.
[defaults.bindings.kotlin.rename]
"CoreError.Actionable.message" = "detail"
"CoreError.Transient.message" = "detail"
"CoreError.Io.message" = "detail"
"CoreError.Invalid.message" = "detail"
"CoreError.Nearby.message" = "detail"
