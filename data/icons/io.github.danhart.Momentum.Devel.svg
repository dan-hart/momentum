<?xml version="1.0" encoding="UTF-8"?>
<!-- SPDX-License-Identifier: GPL-3.0-or-later. GNOME app icon: 128px grid, GNOME palette (Blue 3/5, Light 1). -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#1c71d8"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- ground shadow -->
  <rect x="12" y="20" width="104" height="104" rx="18" fill="#000000" opacity="0.14"/>
  <!-- tile -->
  <rect x="12" y="12" width="104" height="104" rx="18" fill="url(#tile)"/>
  <rect x="12" y="12" width="104" height="52" rx="18" fill="url(#shine)"/>
  <rect x="12" y="98" width="104" height="18" rx="9" fill="#1a5fb4" opacity="0.5"/>
  <!-- motion lines: momentum -->
  <g stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.55">
    <line x1="30" y1="52" x2="46" y2="52"/>
    <line x1="24" y1="68" x2="40" y2="68"/>
    <line x1="30" y1="84" x2="46" y2="84"/>
  </g>
  <!-- check mark -->
  <path d="M 52 66 L 68 82 L 100 46" fill="none" stroke="#1a5fb4" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity="0.35" transform="translate(0,3)"/>
  <path d="M 52 66 L 68 82 L 100 46" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- development stripes, as in GNOME's Devel icon convention -->
  <defs>
    <clipPath id="tileclip"><rect x="12" y="12" width="104" height="104" rx="18"/></clipPath>
    <pattern id="stripes" patternUnits="userSpaceOnUse" width="16" height="16" patternTransform="rotate(45)">
      <rect width="6" height="16" fill="#000000" opacity="0.12"/>
    </pattern>
  </defs>
  <rect x="12" y="12" width="104" height="104" fill="url(#stripes)" clip-path="url(#tileclip)"/>
</svg>
