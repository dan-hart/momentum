[package]
name = "momentum"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A GNOME client for Super Productivity"

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
gettext-rs = { version = "0.7", features = ["gettext-system"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
tracing = "0.1"
tracing-subscriber = "0.3"
sp-model = { path = "../sp-model" }
oo7 = { version = "0.6.0", default-features = false, features = ["async-std", "native_crypto"] }
async-io = "2.6.0"
serde_json.workspace = true
sp-oplog = { version = "0.1.0", path = "../sp-oplog" }
sp-store = { version = "0.1.0", path = "../sp-store" }
sp-sync = { version = "0.1.0", path = "../sp-sync" }
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "global_shortcuts", "background"] }
futures-util = "0.3.34"
