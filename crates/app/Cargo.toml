[package]
name = "momentum"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A native GNOME task planner"

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
gettext-rs = { version = "0.7", features = ["gettext-system"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
tracing = "0.1"
tracing-subscriber = "0.3"
momentum-core = { path = "../momentum-core" }
momentum-model = { path = "../momentum-model" }
oo7 = { version = "0.6.0", default-features = false, features = ["async-std", "native_crypto"] }
async-io = "2.6.0"
serde_json.workspace = true
momentum-oplog = { path = "../momentum-oplog" }
momentum-store = { path = "../momentum-store" }
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "global_shortcuts", "background"] }
futures-util = "0.3.34"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["gtk4_wayland", "gtk4_x11"] }
