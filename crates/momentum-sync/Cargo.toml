[package]
name = "momentum-sync"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
momentum-model = { path = "../momentum-model" }
momentum-oplog = { path = "../momentum-oplog" }
momentum-store = { path = "../momentum-store" }
ureq = "3.4.1"
flate2 = "1.1.10"
base64 = "0.23.1"
argon2 = "0.6.0"
aes-gcm = "0.11.1"
pbkdf2 = "0.13.0"
sha2 = "0.11.0"
sha1 = "0.10.7"
hmac = "0.13.0"
getrandom = "0.4.3"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
url = "2.5.8"
# WebSocket debug/trace formats authentication frames; strip these levels in every frontend.
log = { version = "0.4.34", features = ["max_level_info"] }

[dev-dependencies]
tempfile = "3"
rustls = { version = "0.23.44", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.14.10"
